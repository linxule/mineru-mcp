name: CI & publish

# Verification (audit, build, runtime tests) runs on main pushes, PRs and version tags.
# On a version tag it ALSO publishes — to npm AND the MCP Registry — both via GitHub OIDC, so
# there are NO secrets and nothing to expire:
#   - npm: requires a Trusted Publisher configured for this repo + this workflow
#     on npmjs.com (package Settings -> Trusted Publisher). npm >= 11.5.1
#     auto-detects the Actions OIDC and publishes with provenance, no token.
#   - MCP Registry: `mcp-publisher login github-oidc` proves ownership of the
#     io.github.linxule/* namespace (repo has server.json + mcpName).
#
# Release flow: bump package.json + server.json -> merge -> push matching v* tag.
# Manual dispatch retries registry registration for an existing immutable tag.

on:
  workflow_dispatch:
    inputs:
      registry_tag:
        description: "Existing release tag to register (npm publication is skipped)"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write # npm + mcp-publisher OIDC (tags and registry recovery)
  contents: read

jobs:
  resolve:
    name: Resolve checkout
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.registry_tag) || github.sha }}

      - name: Pin checkout identity
        id: source
        run: |
          SOURCE_SHA="$(git rev-parse --verify HEAD)"
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - run: bun audit

      - run: bun run build # tsc

      - run: bun run test

      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Verify fresh package install on Node 18
        run: bun run test:package

  # Keep the existing required-check name; failed/cancelled matrix jobs must
  # fail this gate instead of making a skipped downstream job look successful.
  ci:
    needs: [resolve, verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every verification job to pass
        env:
          SOURCE_RESULT: ${{ needs.resolve.result }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$VERIFICATION_RESULT" = success

  publish:
    needs: [resolve, verify, ci]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - run: bun run build # create the verified package's dist files

      - name: Guard — release versions must match
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.registry_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          const fail = message => { console.error(message); process.exit(1); };
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            fail(`Tag ${process.env.RELEASE_TAG} != package v${pkg.version}`);
          }
          if (server.version !== pkg.version) {
            fail(`server.json version ${server.version} != package ${pkg.version}`);
          }
          const registrations = Array.isArray(server.packages)
            ? server.packages.filter(entry => entry.registryType === 'npm' && entry.identifier === pkg.name)
            : [];
          if (!registrations.length) fail(`server.json has no npm registration for ${pkg.name}`);
          for (const entry of registrations) {
            if (entry.version !== pkg.version) {
              fail(`server.json npm version ${entry.version} != package ${pkg.version}`);
            }
          }
          console.log(`Release versions match ${process.env.RELEASE_TAG}`);
          NODE

      - name: Publish to npm (tags only, OIDC Trusted Publishing)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish --ignore-scripts

      - name: Wait for exact npm version to propagate
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          curl -fsS --retry 60 --retry-all-errors --retry-delay 5 --retry-max-time 300 --max-time 15 "https://registry.npmjs.org/mineru-mcp/$VERSION" -o /dev/null

      - name: Publish to MCP Registry (GitHub OIDC)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
