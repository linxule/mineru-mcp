version: 2
updates:
  # Bun dependencies and bun.lock are updated together. Grouped so a
  # refresh is ~one PR, not one per dependency (avoids the first-run flood).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # SDK 1.30 permits a Node 20-only adapter on fresh installs.
      # Revisit with the consumer-install Node 18 gate before lifting this bound.
      - dependency-name: "@modelcontextprotocol/sdk"
        versions: [">=1.30.0"]
    groups:
      root-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
